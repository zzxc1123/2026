<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You, Robert!</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 50px 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 520px;
      width: 90%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      color: #1f3c88;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      text-decoration: none;
      padding: 14px 20px;
      margin: 14px 0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .youtube {
      background: #ff0000;
      color: white;
    }

    .canvas {
      background: #0066cc;
      color: white;
    }

    .drive {
      background: #0f9d58;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .note {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #666;
    }

    .footer {
      margin-top: 35px;
      font-size: 0.95rem;
      color: #444;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Thank You, Robert!</h1>

    <p>
      Thank you for all your teaching and support in 2026.<br>
      The 2026 VOTP class appreciates you!
    </p>

    <a class="btn youtube" href="https://youtu.be/I0qhBqYuzXg" target="_blank">
      Watch on YouTube
    </a>

    <a class="btn canvas" href="https://ccsf.instructuremedia.com/embed/66bde37a-b659-4544-adeb-c2b30c625f2d" target="_blank">
      Watch on Canvas Studio
    </a>

    <a class="btn drive" href="https://drive.google.com/file/d/1Ug1MVZkmJ-YVEScbQ59LRpsnZOk6ac9j/view?usp=drive_link" target="_blank">
      Watch / Download on Google Drive
    </a>

  </div>

</body>
</html>
